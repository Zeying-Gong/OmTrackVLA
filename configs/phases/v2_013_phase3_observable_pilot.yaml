    stop: 0.1
    visibility_margin: 0.05
    bbox: 0.05
    angle: 0.05
    distance: 0.05

selection_gate:
  minimum_recovery_val_ade_relative_improvement: 0.02
  minimum_false_visible_reduction: 1
  maximum_false_invisible_increase: 0
  maximum_clean_ade_relative_regression: 0.10
  maximum_clean_ade_absolute_slack_m: 0.01

