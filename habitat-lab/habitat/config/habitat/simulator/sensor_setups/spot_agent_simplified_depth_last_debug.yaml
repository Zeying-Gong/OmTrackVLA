# @package habitat.simulator.agents.spot_agent
# Debug variant: keep jaw depth, but register it after all color/semantic sensors.
defaults:
  - /habitat/simulator/sim_sensors@sim_sensors.jaw_rgb_sensor: jaw_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.jaw_panoptic_sensor: jaw_panoptic_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.third_rgb_sensor: third_rgb_sensor
  - /habitat/simulator/sim_sensors@sim_sensors.jaw_depth_sensor: jaw_depth_sensor

sim_sensors:
  jaw_rgb_sensor:
    height: 384
    width: 384
    hfov: 90
  jaw_panoptic_sensor:
    height: 384
    width: 384
    hfov: 90
  third_rgb_sensor:
    height: 384
    width: 384
  jaw_depth_sensor:
    height: 384
    width: 384
    hfov: 90
    min_depth: 0.0
    max_depth: 10.0
