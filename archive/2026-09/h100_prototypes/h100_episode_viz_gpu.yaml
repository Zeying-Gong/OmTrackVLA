config_version: 1
cluster: aliyun_h100
image: ai-base:ubuntu22.04-sim5.0.0-lab_MD2.2.1-ray2.52.0-cu12.8_devel-v2.0
num_gpus: 1
shared_workspace: /data/nas_ray/home/zeying.gong/algorithm/repos/OmTrackVLA
log_folder: omtrackvla_episode_viz_gpu
os_env_vars:
  PYTHONPATH: /data/nas_ray/home/zeying.gong/algorithm/repos/OmTrackVLA
tasks:
  - name: omtrackvla_episode_viz_gpu
    type: shell
    num_gpus: 1
    timeout: 1800
    cmd: |
      set -euo pipefail
      ENV=/data/nas_ray/home/zeying.gong/algorithm/envs/internnav_gpu
      test -x "$ENV/bin/python"
      export PATH="$ENV/bin:$PATH"
      export LD_LIBRARY_PATH="$ENV/lib:${LD_LIBRARY_PATH:-}"
      export EGL_PLATFORM=surfaceless
      cd /data/nas_ray/home/zeying.gong/algorithm/repos/OmTrackVLA
      "$ENV/bin/python" tools/render_track_episodes.py
