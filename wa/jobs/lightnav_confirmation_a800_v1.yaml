config_version: 1
cluster: baidu_a800
image: x5-builder:cuda12.8-isaac5.0.0-v2.test1
num_gpus: 2
log_folder: wa_lightnav_confirmation_v1
tasks:
  - name: wa_lightnav_confirmation24_v1
    type: shell
    workload_backend: k8s
    num_gpus: 2
    timeout: 14400
    cmd: |
      set -euo pipefail
      ROOT=/data/nas_ray/home/zeying.gong/algorithm/repos/WA-Mobile-Tracking-20260928
      BENCH=/data/nas_ray/home/zeying.gong/algorithm/repos/OmTrackVLA-da3-polar-20260924
      WLA=/data/nas_ray/home/zeying.gong/algorithm/repos/WLA-EVT-20260925
      cd "$ROOT/source_yaw_confirmation_v1"
      test "$(git rev-parse HEAD)" = 0a12e09aa249b6bcfac5e56ea4b5c82152d49b4b
      test -z "$(git status --porcelain)"
      export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1
      export TOKENIZERS_PARALLELISM=false OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 MKL_NUM_THREADS=2
      export TRACKVLA_SAVE_VIDEO=0 SAVE_VIDEO=0 TRACKVLA_VERBOSE_STEPS=0 TRACKVLA_LIVE_FRAME_INTERVAL=10
      export HABITAT_SIM_LOG=quiet MAGNUM_LOG=quiet
      export WA_DIAG_SPLIT=confirmation
      (cd "$WLA" && sha256sum --quiet -c lightnav_transport_20260927/source.sha256 && sha256sum --quiet -c evt_text_action_v3/benchmark_protocol.sha256)
      OUTPUT_ROOT="/data/nas_ray/project/md-ak/users/zeying.gong/job_${MD_AK_JOB_ID}/task_${MD_AK_TASK_ID}/wa_lightnav_confirmation_v1"
      mkdir "$OUTPUT_ROOT"
      source "$BENCH/scripts/runtime/install_xvfb_bundle.sh" "$BENCH/artifacts/xvfb_bundle"
      if [ ! -e /usr/bin/xkbcomp ]; then ln -s "$XVFB_ROOT/usr/bin/xkbcomp" /usr/bin/xkbcomp; fi
      if [ ! -e /usr/share/X11/xkb ]; then ln -s "$XVFB_ROOT/usr/share/X11/xkb" /usr/share/X11/xkb; fi
      PYTHONPATH="$PWD" "$ROOT/probe_env/bin/python" -u -m wa.wm.reference_review_launch "$OUTPUT_ROOT/lightnav"
