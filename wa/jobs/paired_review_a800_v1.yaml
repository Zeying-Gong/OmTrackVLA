    type: shell
    workload_backend: k8s
    num_gpus: 2
    timeout: 14400
    cmd: |
      set -euo pipefail
      ROOT=/data/nas_ray/home/zeying.gong/algorithm/repos/WA-Mobile-Tracking-20260928
      BENCH=/data/nas_ray/home/zeying.gong/algorithm/repos/OmTrackVLA-da3-polar-20260924
