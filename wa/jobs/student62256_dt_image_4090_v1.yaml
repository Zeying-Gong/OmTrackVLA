# Full1405 candidate62256 DT direct image/no-UWB inference; same trained checkpoint, not no-UWB retraining.
# Frozen source and evaluation protocol from completed mixed62256 DT; mode=image only.
# One independent full1405 DT task on eight RTX4090 GPUs; fresh output, no old student rows.
# Target4090 image developer one-step was unavailable; admit results only after guarded worker GPU, ready and episode evidence.
config_version: 1
cluster: baidu_4090
image: x5-builder:cuda12.8-isaac5.0.0-v2.test1
num_gpus: 8
log_folder: wa_student62256_dt_image_4090_v1
tasks:
