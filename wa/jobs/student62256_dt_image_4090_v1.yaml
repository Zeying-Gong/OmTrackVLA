      output = Path(os.environ['OUTPUT_ROOT'])
      assert output.is_absolute() and not output.exists() and not output.is_symlink()
      print(json.dumps(dict(status='CANDIDATE62256_IMAGE_EVAL_CPU_PREFLIGHT_PASS_NOT_SR',
          task=os.environ['WA_EVAL_TASK'], expected_episodes=1405, checkpoint=str(checkpoint),
          checkpoint_sha256=checkpoint_sha, checkpoint_step=61252, input_sha256=pins,
          closed_loop_result_established=False)), flush=True)
      PY
      # Worker allocation only; this block is not run during CPU-only configuration checks.
      /data/nas_ray/home/zeying.gong/algorithm/repos/WA-Mobile-Tracking-20260928/probe_env/bin/python -B - <<'PY'
      import csv, json, subprocess
      import torch
      assert torch.__version__ == '2.8.0+cu128'
      assert torch.cuda.is_available() and torch.cuda.device_count() == 8
      visible = [dict(index=i, name=torch.cuda.get_device_name(i),
                      capability=list(torch.cuda.get_device_capability(i))) for i in range(8)]
      assert all(row['name'] == 'NVIDIA GeForce RTX 4090' and row['capability'] == [8,9] for row in visible)
      physical = [list(map(str.strip,row)) for row in csv.reader(subprocess.check_output(
          ['nvidia-smi','--query-gpu=uuid,name,memory.total,driver_version',
           '--format=csv,noheader,nounits'],text=True).splitlines())]
      assert len(physical) == 8 and len({row[0] for row in physical}) == 8
      assert all(len(row) == 4 and row[0].startswith('GPU-') and
          row[1] == 'NVIDIA GeForce RTX 4090' and int(row[2]) >= 24000 and row[3]
          for row in physical)
      print(json.dumps(dict(stage='EIGHT_REAL_RTX4090_ALLOCATION_VERIFIED',
          cuda=visible, uuid_model_memory_driver=physical)),flush=True)
      PY
      test ! -e "$OUTPUT_ROOT"
      test ! -L "$OUTPUT_ROOT"
      bash wa/scripts/eval_full_mixed.sh "$OUTPUT_ROOT"
